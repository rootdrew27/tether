[project]
name = "tether"
version = "0.1.0"
description = "Typed-relationship annotation layer over content, layered on git"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.7",
    "msgspec>=0.19.0",
    "uuid-utils>=0.10.0",
]

[project.scripts]
tether = "tether.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tether"]

[dependency-groups]
dev = [
    "pdf2image>=1.17.0",
    "pdfplumber>=0.11.9",
    "pyright>=1.1.409",
    "pytesseract>=0.3.13",
    "pytest>=8.0.0",
    "ruff>=0.15.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
